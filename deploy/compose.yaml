# teamplanner stack - target host + domain TBD (docs/deploy-to-<host>.md written
# at first deploy). Build from a repo clone on the host; run compose from deploy/.
#
# 2 services:
#   tp-app - Nuxt 4 full-stack (Nitro server serves pages + /api/*)
#   tp-db  - PostgreSQL 17 (only reachable on the stack network, no host port)

name: teamplanner

services:
  tp-app:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    image: teamplanner/app:local
    container_name: tp-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamplanner}:${POSTGRES_PASSWORD}@tp-db:5432/${POSTGRES_DB:-teamplanner}
    ports:
      - "${TP_HTTP_PORT:-3000}:3000"
    depends_on:
      tp-db:
        condition: service_healthy
    restart: unless-stopped
    # Behind Traefik: use the host overlay instead of editing this file -
    # e.g. traefik.dexter.yaml (removes ports:, joins the proxy network, adds the
    # routing labels with the host's observed resolver/network names):
    #   docker compose -f compose.yaml -f traefik.<host>.yaml up -d

  tp-db:
    image: postgres:17-alpine
    container_name: tp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-teamplanner}
    volumes:
      - tp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamplanner} -d ${POSTGRES_DB:-teamplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  # All app state lives in Postgres (uploads are DB columns) - this is the one
  # volume that must be backed up (pg_dump, see deploy/README.md).
  tp-pgdata:
