# Traefik overlay for dexter.syquens.com - values observed on the host 2026-08-03:
# provider network `traefik-proxy`, cert resolver `myresolver` (TLS challenge),
# entrypoint `websecure` (crowdsec middleware applied globally on the entrypoint).
#
# Run from deploy/ on the host:
#   docker compose -f compose.yaml -f traefik.dexter.yaml up -d
#
# TP_HTTP_PORT in .env is unused in this mode (no host port published).

services:
  tp-app:
    ports: !reset []
    networks:
      default: null
      traefik-proxy: null
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.tp-app.rule=Host(`teamplanner.syquens.com`)"
      - "traefik.http.routers.tp-app.entrypoints=websecure"
      - "traefik.http.routers.tp-app.tls.certresolver=myresolver"
      - "traefik.http.services.tp-app.loadbalancer.server.port=3000"
      # Router middlewares chain AFTER the entrypoint's global crowdsec@docker -
      # naming them here does not disable crowdsec.
      - "traefik.http.routers.tp-app.middlewares=tp-ratelimit@docker,tp-headers@docker"
      - "traefik.http.middlewares.tp-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.tp-ratelimit.ratelimit.burst=40"
      # HSTS: the hostname is HTTPS-only by construction (no router on `web`).
      - "traefik.http.middlewares.tp-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tp-headers.headers.stsIncludeSubdomains=false"
      - "traefik.http.middlewares.tp-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.tp-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tp-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.tp-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.tp-headers.headers.customResponseHeaders.X-Powered-By="

networks:
  traefik-proxy:
    external: true
